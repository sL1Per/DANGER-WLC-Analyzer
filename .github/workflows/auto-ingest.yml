name: auto-ingest
# Posts the guild's newly finished WCL raid logs to Discord (apps/web/scripts/autoIngest.ts).
# GitHub may start scheduled runs late, and disables schedules after 60 days without
# repo activity — re-enable from the Actions tab if posts stop.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Load and print, but don't publish, post or save state"
        type: boolean
        default: true
      since:
        description: "Optional start date (e.g. 2026-10-20) to look further back than LOOKBACK_HOURS"
        type: string
        default: ""
# The job only reads the repo; it talks to WCL/Discord/the API with its own secrets.
permissions:
  contents: read
# Never let two runs overlap, or the same raid could be posted twice.
concurrency:
  group: auto-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    # The secrets and variables below are scoped to the "prod" environment.
    environment: prod
    timeout-minutes: 20
    steps:
      # Actions pinned to commits: this job holds the WCL key and Discord webhook.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Ingest new raid logs
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$SINCE" ]; then args+=("--since=$SINCE"); fi
          pnpm --filter @wcl/web ingest "${args[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SINCE: ${{ inputs.since }}
          GUILD_ID: "811975"
          # Each run posts every finished, not-yet-posted log from this window.
          LOOKBACK_HOURS: "48"
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          API_BASE: ${{ vars.API_BASE }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
